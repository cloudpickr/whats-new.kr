name: Deploy All
on:
  push:
    branches: [main]

# This project ships as ONE Cloudflare Worker: the Astro SSR site and the
# backend API/pipeline/cron/queue/MCP are built together by @astrojs/cloudflare
# (v14) and deployed with a single `wrangler deploy`. There is no separate Pages
# project or standalone backend Worker anymore — see src/worker.ts for the
# in-Worker routing (/api/* and /mcp -> backend, everything else -> SSR).

# Only the latest push to main needs to deploy; cancel any in-progress run for
# the same ref so rapid successive pushes don't stack up redundant builds.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ALLOWED_ADMIN_IPS holds a public IP and is intentionally NOT in source.
      # It is injected into the Worker at deploy time from this GitHub secret.
      # Refuse to deploy with an empty allowlist rather than silently widening
      # admin access.
      - name: Require admin IP secret
        env:
          ALLOWED_ADMIN_IPS: ${{ secrets.ALLOWED_ADMIN_IPS }}
        run: |
          if [ -z "$ALLOWED_ADMIN_IPS" ]; then
            echo "ALLOWED_ADMIN_IPS GitHub secret is empty. Refusing to deploy an empty admin allowlist."
            exit 1
          fi

      - run: npm ci

      # Regenerate worker-configuration.d.ts (gitignored) so the Astro type
      # check during build has the binding types.
      - run: npx wrangler types

      - run: npm run build
        env:
          # Single source of truth for the public site origin. Set as a repo
          # variable: gh variable set SITE_URL. astro.config.mjs reads it at
          # build time to drive canonical URLs and the sitemap.
          SITE_URL: ${{ vars.SITE_URL }}

      # Deploy the unified Worker. @astrojs/cloudflare writes a deploy redirect
      # (.wrangler/deploy/config.json) that points `wrangler deploy` at the
      # adapter output in dist/server, so no --config is needed here. The
      # ALLOWED_ADMIN_IPS var is merged into the Worker's runtime vars.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          vars: |
            ALLOWED_ADMIN_IPS
        env:
          ALLOWED_ADMIN_IPS: ${{ secrets.ALLOWED_ADMIN_IPS }}

      - name: Cleanup old Worker deployments (keep latest 3)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCRIPT_NAME: cloud-whats-new
        run: |
          python3 - <<'EOF'
          import json, urllib.request, urllib.error, os, sys

          token = os.environ['CF_TOKEN']
          account = os.environ['CF_ACCOUNT']
          script = os.environ['SCRIPT_NAME']
          keep = 3

          url = f"https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/{script}/deployments"
          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
          payload = json.loads(urllib.request.urlopen(req).read())
          deployments = payload.get('result', {}).get('deployments', [])

          print(f"Worker deployments: {len(deployments)} total, keeping {min(keep, len(deployments))}, deleting {max(0, len(deployments) - keep)}")

          for deployment in deployments[keep:]:
              deployment_id = deployment['id']
              created_on = deployment.get('created_on', '')
              del_url = f"https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/{script}/deployments/{deployment_id}"
              del_req = urllib.request.Request(del_url, method="DELETE", headers={"Authorization": f"Bearer {token}"})
              try:
                  urllib.request.urlopen(del_req)
                  print(f"Deleted deployment {deployment_id[:8]} ({created_on[:10]})")
              except urllib.error.HTTPError as e:
                  print(f"Failed to delete deployment {deployment_id[:8]}: {e.code}", file=sys.stderr)
          EOF
