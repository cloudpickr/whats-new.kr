name: Observability API probe (manual, read-only)

# One-off diagnostic: checks whether the repo's CLOUDFLARE_API_TOKEN can reach
# the Workers Observability telemetry query API (needed for the detect->issue
# automation) and probes whether any Issues endpoint is reachable.
# It changes NOTHING — pure read/probe — so it is safe to run.
# Run from the Actions tab (workflow_dispatch) and read the HTTP codes.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SCRIPT: cloud-whats-new
    steps:
      - name: Probe Observability APIs
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          token = os.environ["CF_TOKEN"]
          account = os.environ["CF_ACCOUNT"]
          script = os.environ["SCRIPT"]
          base = f"https://api.cloudflare.com/client/v4/accounts/{account}"
          now = int(time.time() * 1000)
          frm = now - 24 * 60 * 60 * 1000

          def call(method, url, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, data=data, method=method,
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status, r.read(1200).decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read(1200).decode("utf-8", "replace")
              except Exception as e:
                  return 0, str(e)

          print("=== token verify ===")
          c, b = call("GET", "https://api.cloudflare.com/client/v4/user/tokens/verify")
          print(c, b[:300], "\n")

          print("=== telemetry/query (calculations: 24h event count) ===")
          q = {
            "queryId": "probe-adhoc",
            "timeframe": {"from": frm, "to": now},
            "parameters": {
              "datasets": ["cloudflare-workers"],
              "filters": [{"key": "$metadata.service", "operation": "eq", "type": "string", "value": script}],
              "calculations": [{"operator": "count", "alias": "events"}],
            },
            "view": "calculations",
            "limit": 10,
          }
          c, b = call("POST", f"{base}/workers/observability/telemetry/query", q)
          print(c, b[:800], "\n")

          print("=== candidate Issues endpoints (GET) ===")
          for ep in [
              "workers/observability/issues",
              f"workers/scripts/{script}/observability/issues",
              "workers/observability/telemetry/issues",
          ]:
              c, b = call("GET", f"{base}/{ep}")
              print(f"GET /{ep} -> {c}: {b[:200]}")
          print("\nDone. Read HTTP codes above (403 = missing scope; 200 = OK).")
          PY
