name: WAF rate limiting (manual)

# Add a conservative free-tier rate-limiting rule protecting /mcp from token
# brute-force and flooding: if a single IP exceeds 30 requests in 10s to /mcp,
# block it for 60s (429). Thresholds sit far above our own usage:
#   - cron is an internal trigger (not external HTTP) -> never counted
#   - SSR->backend is in-process (not HTTP)           -> never counted
#   - MCP callers (cloudpick-docs eval ~9 reqs biweekly; multi-agent intermittent)
#     are nowhere near 30 req / 10s per IP
# Only /mcp is counted, so page/asset traffic is never limited. Free tier allows
# a single rate-limit rule, so this replaces the default "Leaked credential
# check" (which only applies to password login forms this site doesn't have).
#
# mode=probe (default): read-only. mode=apply: create/replace the rule.
# Needs CLOUDFLARE_API_TOKEN with Zone.WAF (+ Zone read).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe | apply'
        required: true
        default: 'probe'
        type: choice
        options: [probe, apply]
      threshold:
        description: 'requests per period (default 30)'
        required: false
        default: '30'
        type: string
      period:
        description: 'period seconds: 10 or 60 (default 10)'
        required: false
        default: '10'
        type: string

permissions:
  contents: read

jobs:
  ratelimit:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MODE: ${{ github.event.inputs.mode }}
      THRESHOLD: ${{ github.event.inputs.threshold }}
      PERIOD: ${{ github.event.inputs.period }}
      ZONE_NAME: whats-new.kr
    steps:
      - name: Configure rate limiting
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          token = os.environ["CF_TOKEN"]
          mode = (os.environ.get("MODE") or "probe").strip()
          threshold = int(os.environ.get("THRESHOLD") or "30")
          period = int(os.environ.get("PERIOD") or "10")
          if period not in (10, 60):
              period = 10
          zone_name = os.environ["ZONE_NAME"]
          api = "https://api.cloudflare.com/client/v4"

          def call(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(api + path, data=data, method=method,
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status, json.loads(r.read().decode("utf-8", "replace"))
              except urllib.error.HTTPError as e:
                  try: return e.code, json.loads(e.read().decode("utf-8", "replace"))
                  except Exception: return e.code, {"raw": "non-json"}

          c, d = call("GET", f"/zones?name={zone_name}")
          if c != 200 or not d.get("result"):
              print(f"zone lookup failed: {c} {json.dumps(d)[:300]}"); raise SystemExit(1)
          zid = d["result"][0]["id"]
          print(f"zone {zone_name} -> {zid}")

          c, d = call("GET", f"/zones/{zid}/rulesets/phases/http_ratelimit/entrypoint")
          print(f"ratelimit entrypoint: HTTP {c}")
          existing = d.get("result", {}).get("rules", []) if c == 200 else []
          for r in existing:
              print(f"  existing: {r.get('description','')[:50]} action={r.get('action')}")

          if mode != "apply":
              print("\nmode=probe; no changes.")
              raise SystemExit(0)

          desc = "Per-IP flood/brute-force protection on /mcp"
          rule = {
              "description": desc,
              "action": "block",
              # Protect the authenticated/public MCP endpoint from token
              # brute-force and flooding. Only /mcp requests are counted, so
              # page/asset traffic is unaffected. Our own MCP callers
              # (cloudpick-docs eval ~9 reqs biweekly; multi-agent intermittent)
              # are far below 30 req / 10s per IP, so they are never limited.
              "expression": 'starts_with(http.request.uri.path, "/mcp")',
              "ratelimit": {
                  "characteristics": ["ip.src", "cf.colo.id"],
                  "period": period,
                  "requests_per_period": threshold,
                  "mitigation_timeout": 60,
              },
              "enabled": True,
          }
          # Free tier allows a single rate-limit rule. Replace any existing rules
          # (incl. the default "Leaked credential check", which only applies to
          # password login forms we don't have) with this /mcp protection.
          clean = [rule]
          c, d = call("PUT", f"/zones/{zid}/rulesets/phases/http_ratelimit/entrypoint",
                      {"rules": clean})
          ok = c == 200 and d.get("success")
          print(f"\nPUT ratelimit rule ({threshold} req / {period}s, block 60s) -> "
                f"{'OK' if ok else f'HTTP {c} ' + json.dumps(d)[:400]}")
          PY
