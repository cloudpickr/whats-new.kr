name: WAF setup (manual)

# Configure free-tier WAF to block vulnerability-scanner noise at the edge, so
# it never reaches the Worker or files observability issues.
#   mode=probe   (default) read-only: find the zone, check token scope, list
#                the entrypoint rulesets. Changes nothing.
#   mode=apply   enable the Free Managed Ruleset + add one custom rule that
#                blocks common scanner paths (free tier: no regex -> uses
#                wildcard/contains on uri.path).
#
# Needs CLOUDFLARE_API_TOKEN to include Zone.WAF (and Zone read) for whats-new.kr.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe | apply'
        required: true
        default: 'probe'
        type: choice
        options: [probe, apply]

permissions:
  contents: read

jobs:
  waf:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MODE: ${{ github.event.inputs.mode }}
      ZONE_NAME: whats-new.kr
    steps:
      - name: Configure WAF
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          token = os.environ["CF_TOKEN"]
          account = os.environ["CF_ACCOUNT"]
          mode = (os.environ.get("MODE") or "probe").strip()
          zone_name = os.environ["ZONE_NAME"]
          api = "https://api.cloudflare.com/client/v4"

          def call(method, path, body=None):
              url = api + path
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, data=data, method=method,
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status, json.loads(r.read().decode("utf-8", "replace"))
              except urllib.error.HTTPError as e:
                  try:
                      return e.code, json.loads(e.read().decode("utf-8", "replace"))
                  except Exception:
                      return e.code, {"raw": "non-json"}

          # 1) Find the zone id
          c, d = call("GET", f"/zones?name={zone_name}")
          if c != 200 or not d.get("success") or not d.get("result"):
              print(f"Zone lookup failed: HTTP {c}: {json.dumps(d)[:400]}")
              raise SystemExit(1)
          zone = d["result"][0]
          zid = zone["id"]
          print(f"Zone: {zone_name} -> {zid} (plan: {zone.get('plan',{}).get('name','?')})")

          # 2) List the http_request_firewall_custom entrypoint ruleset
          c, d = call("GET", f"/zones/{zid}/rulesets/phases/http_request_firewall_custom/entrypoint")
          print(f"custom-phase entrypoint: HTTP {c}")
          if c == 200:
              rs = d.get("result", {})
              print(f"  ruleset id: {rs.get('id')}  rules: {len(rs.get('rules',[]))}")
              for r in rs.get("rules", []):
                  print(f"    - {r.get('description','')[:60]}  action={r.get('action')}")
          else:
              print(f"  {json.dumps(d)[:300]}")

          # 3) Managed ruleset entrypoint (to enable Free Managed Ruleset)
          c2, d2 = call("GET", f"/zones/{zid}/rulesets/phases/http_request_firewall_managed/entrypoint")
          print(f"managed-phase entrypoint: HTTP {c2}")

          if mode != "apply":
              print("\nmode=probe; no changes. If HTTP 200 above, token has WAF scope.")
              raise SystemExit(0)

          # ---- apply ----
          # Free tier: no regex. Block common scanner paths using contains on
          # lower(http.request.uri.path). One custom rule, OR-combined.
          def pcontains(s):
              return f'lower(http.request.uri.path) contains "{s}"'
          scanner_expr = " or ".join(pcontains(s) for s in [
              ".php", ".env", ".git", "/wp-", "/wp/", "wordpress",
              "/.aws", "/.ssh", ".dockerenv", "phpmyadmin", "/console",
              "xmlrpc", "service-account", "secrets.", "/cgi-bin",
          ])
          rule = {
              "action": "block",
              "description": "Block vulnerability-scanner probe paths (edge)",
              "expression": scanner_expr,
              "enabled": True,
          }
          # Append to the custom entrypoint via PUT. PUT on the phase entrypoint
          # creates the ruleset if it does not exist yet (404 on GET is fine).
          c, d = call("GET", f"/zones/{zid}/rulesets/phases/http_request_firewall_custom/entrypoint")
          existing = d.get("result", {}).get("rules", []) if c == 200 else []
          # avoid duplicate by description
          existing = [r for r in existing if r.get("description") != rule["description"]]
          # strip server-managed fields from existing rules for the PUT body
          clean = []
          for r in existing:
              clean.append({k: r[k] for k in ("action","description","expression","enabled") if k in r})
          clean.append(rule)
          c, d = call("PUT", f"/zones/{zid}/rulesets/phases/http_request_firewall_custom/entrypoint",
                      {"rules": clean})
          print(f"\nPUT custom rules -> HTTP {c}: {'OK' if d.get('success') else json.dumps(d)[:500]}")

          # Enable Free Managed Ruleset. The id differs per account/entitlement,
          # so discover it from the account's available managed rulesets instead
          # of hardcoding. Look for the Cloudflare-managed "free" ruleset.
          c, d = call("GET", f"/accounts/{account}/rulesets?per_page=100")
          free_id = None
          if c == 200:
              for rs in d.get("result", []):
                  name = (rs.get("name") or "").lower()
                  if rs.get("kind") == "managed" and ("free" in name):
                      free_id = rs.get("id")
                      print(f"Found managed ruleset: {rs.get('name')} -> {free_id}")
                      break
              if not free_id:
                  print("Available managed rulesets:")
                  for rs in d.get("result", []):
                      if rs.get("kind") == "managed":
                          print(f"  {rs.get('id')}  {rs.get('name')}")
          else:
              print(f"Could not list account rulesets: HTTP {c} {json.dumps(d)[:200]}")

          if free_id:
              c, d = call("PUT", f"/zones/{zid}/rulesets/phases/http_request_firewall_managed/entrypoint",
                          {"rules": [{"action": "execute",
                                      "action_parameters": {"id": free_id},
                                      "expression": "true",
                                      "enabled": True,
                                      "description": "Cloudflare Free Managed Ruleset"}]})
              print(f"Enable Free Managed Ruleset -> HTTP {c}: {'OK' if d.get('success') else json.dumps(d)[:400]}")
          else:
              print("Free Managed Ruleset id not found; skipping managed-ruleset enable "
                    "(enable it once in the dashboard: Security > WAF > Managed rules).")
          PY
