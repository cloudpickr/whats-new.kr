name: Zone governance (free-tier security hardening)

# Audit (probe) or apply free-tier zone security governance for whats-new.kr:
#   SSL/TLS: Always Use HTTPS, min TLS 1.2, TLS 1.3, Automatic HTTPS Rewrites,
#            Opportunistic Encryption, HSTS.
#   Also reports Security Level and Browser Integrity Check.
#
# Deliberately NOT enabled here (would risk our own traffic):
#   - Bot Fight Mode: could challenge the MCP API callers (cloudpick-docs,
#     multi-agent) and RSS fetches. Left off on purpose.
#
# mode=probe (default): read-only audit. mode=apply: set the safe settings.
# Needs CLOUDFLARE_API_TOKEN with Zone Settings:Edit (+ Zone read) for the zone.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe | apply'
        required: true
        default: 'probe'
        type: choice
        options: [probe, apply]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MODE: ${{ github.event.inputs.mode }}
      ZONE_NAME: whats-new.kr
    steps:
      - name: Audit / apply zone settings
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          token = os.environ["CF_TOKEN"]
          mode = (os.environ.get("MODE") or "probe").strip()
          zone_name = os.environ["ZONE_NAME"]
          api = "https://api.cloudflare.com/client/v4"

          def call(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(api + path, data=data, method=method,
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status, json.loads(r.read().decode("utf-8", "replace"))
              except urllib.error.HTTPError as e:
                  try: return e.code, json.loads(e.read().decode("utf-8", "replace"))
                  except Exception: return e.code, {"raw": "non-json"}

          c, d = call("GET", f"/zones?name={zone_name}")
          if c != 200 or not d.get("result"):
              print(f"zone lookup failed: {c} {json.dumps(d)[:300]}"); raise SystemExit(1)
          zid = d["result"][0]["id"]
          print(f"zone {zone_name} -> {zid}\n")

          # Settings to audit/set: (setting_id, desired_value, label)
          SAFE_SETTINGS = [
              ("always_use_https", "on",  "Always Use HTTPS"),
              ("min_tls_version",  "1.2", "Minimum TLS version"),
              ("tls_1_3",          "on",  "TLS 1.3"),
              ("automatic_https_rewrites", "on", "Automatic HTTPS Rewrites"),
              ("opportunistic_encryption", "on", "Opportunistic Encryption"),
              ("browser_check",    "on",  "Browser Integrity Check"),
              ("security_header",  None,  "HSTS (set via apply block)"),  # special
          ]

          print("=== current settings ===")
          current = {}
          c, d = call("GET", f"/zones/{zid}/settings")
          if c == 200:
              for s in d.get("result", []):
                  current[s.get("id")] = s.get("value")
          for sid, _, label in SAFE_SETTINGS:
              print(f"  {label} ({sid}): {json.dumps(current.get(sid))[:80]}")

          if mode != "apply":
              print("\nmode=probe; no changes.")
              raise SystemExit(0)

          print("\n=== applying safe settings ===")
          for sid, val, label in SAFE_SETTINGS:
              if sid == "security_header":
                  # HSTS: 6 months, includeSubDomains, no preload (reversible).
                  body = {"value": {"strict_transport_security": {
                      "enabled": True, "max_age": 15552000,
                      "include_subdomains": True, "preload": False, "nosniff": True}}}
              else:
                  body = {"value": val}
              c, d = call("PATCH", f"/zones/{zid}/settings/{sid}", body)
              ok = c == 200 and d.get("success")
              print(f"  {label} -> {'OK' if ok else f'HTTP {c} ' + json.dumps(d)[:200]}")
          print("\nNote: Bot Fight Mode intentionally NOT enabled (would risk MCP/RSS traffic).")
          PY
